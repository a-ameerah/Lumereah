{% extends 'base.html' %}
{% block content %}
    <h2>Create account</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
